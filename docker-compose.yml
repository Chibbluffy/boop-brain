networks:
  boop-brain:
    external: true # one-time setup: `docker network create boop-brain`
                    # then: `docker network connect boop-brain <existing-qdrant-container-name>`

services:
  redis:
    image: redis:7-alpine
    container_name: boopbot-redis
    restart: unless-stopped
    networks: [boop-brain]
    volumes:
      - redis-data:/data
    command: ["redis-server", "--save", "60", "1"]

  brain:
    build: .
    container_name: boopbot-brain
    restart: unless-stopped
    env_file: .env
    networks: [boop-brain]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "10.8.0.200:8000:8000"
    depends_on:
      - redis
    volumes:
      - ./persona:/app/persona:ro

volumes:
  redis-data:
